name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: Format, analyze, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      # The installer script is part of the build: compile it against
      # the fresh build output so a broken script fails here, not at
      # release time.
      # GitHub's Windows images already carry Inno Setup 6; only
      # install it (the Chocolatey package is "innosetup") when absent.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup 6 already installed"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Compile installer (gate)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path installer/payload | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* installer/payload/
          Copy-Item LICENSE installer/payload/
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/TermiNote.iss
