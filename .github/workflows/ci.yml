name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: terminote-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-and-ui:
    name: Rust core tests and Web UI check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true

      - name: Test note storage and CLI
        run: cargo test --locked -p terminote-core

      - name: Check Rust Web UI
        run: cargo check --locked -p terminote-ui --target wasm32-unknown-unknown

  build-windows-x64:
    name: Build Windows 11 x64 app and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true

      - name: Install pinned Dioxus and Tauri CLIs
        shell: pwsh
        run: .github/scripts/install-windows-tools.ps1

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not installed: $iscc" }

      - name: Test Rust core
        run: cargo test --locked -p terminote-core

      - name: Build Tauri x64 app
        shell: pwsh
        run: |
          Push-Location src-tauri
          cargo tauri build --target x86_64-pc-windows-msvc --no-bundle
          Pop-Location

      - name: Test Windows tray restore and Quit
        shell: powershell
        run: .github/scripts/windows-tray-smoke.ps1

      - name: Test Windows updater safeguards
        shell: pwsh
        run: |
          Push-Location src-tauri
          cargo test --locked -p terminote --lib
          Pop-Location

      - name: Build Inno Setup installer and portable x64 zip
        shell: pwsh
        run: |
          $target = "target/x86_64-pc-windows-msvc/release"
          $exe = Join-Path $target "terminote.exe"
          if (-not (Test-Path $exe)) { throw "Tauri executable was not produced: $exe" }

          $payload = "installer/payload"
          if (Test-Path $payload) { Remove-Item $payload -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item $exe "$payload/TermiNote.exe"
          Copy-Item LICENSE "$payload/"

          $portable = "portable"
          if (Test-Path $portable) { Remove-Item $portable -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item $exe "$portable/TermiNote.exe"
          Copy-Item LICENSE, PORTABLE.txt "$portable/"
          New-Item -ItemType File -Force -Path "$portable/portable.txt" | Out-Null
          $loader = Get-ChildItem "$target" -Filter "WebView2Loader.dll" -Recurse | Select-Object -First 1
          if ($loader) {
            Copy-Item $loader.FullName "$payload/"
            Copy-Item $loader.FullName "$portable/"
          }

          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "installer\TermiNote.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "TermiNote-Setup-x64.exe")) { throw "Inno Setup installer was not produced" }

          Compress-Archive -Path portable/* -DestinationPath "TermiNote-Portable-x64.zip" -Force

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: TermiNote-Windows-x64
          path: |
            TermiNote-Setup-x64.exe
            TermiNote-Portable-x64.zip
