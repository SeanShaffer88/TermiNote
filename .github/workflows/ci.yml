name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Full gate (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Test (all targets)
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc

      - name: Release build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
