name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release (x64 only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Full gate
        run: |
          flutter analyze
          flutter test

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Stage portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* portable/
          Copy-Item LICENSE portable/
          Copy-Item PORTABLE.txt portable/

      - name: Make portable zip
        shell: pwsh
        run: Compress-Archive -Path portable/* -DestinationPath TermiNote-Portable-x64.zip

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/payload | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* installer/payload/
          Copy-Item LICENSE installer/payload/
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer/TermiNote.nsi

      - name: Publish release with exactly the two x64 assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TermiNote-Setup-x64.exe
            TermiNote-Portable-x64.zip
