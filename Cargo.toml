[workspace]
members = ["crates/core", "ui", "src-tauri"]
default-members = ["crates/core", "ui"]
resolver = "2"

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dioxus builds WebAssembly with this profile. Keep custom sections that
# wasm-bindgen needs; native release binaries still use the stripped profile.
[profile.wasm-release]
inherits = "release"
strip = false

