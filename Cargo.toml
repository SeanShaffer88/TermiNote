[package]
name = "terminote"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A dark terminal-themed desktop notepad for Windows. Notes with titles, bodies and tags, stored locally as JSON."
homepage = "https://github.com/SeanShaffer88/TermiNote"
repository = "https://github.com/SeanShaffer88/TermiNote"

[[bin]]
name = "TermiNote"
path = "src/main.rs"

[lib]
name = "terminote"
path = "src/lib.rs"

[profile.release]
opt-level = 3
