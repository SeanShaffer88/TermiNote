name: terminote
description: >-
  TermiNote - a dark terminal-themed notepad for Windows. Notes have a title
  and a body, the list shows titles only, and notes are organised with tags.
publish_to: 'none'

version: 0.6.0+9

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
